name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_lab"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Verify migrations, ledger, leases and keyset pagination
        run: |
          mkdir -p evidence
          db-bench verify --seed-rows 3000 > evidence/platform-verification.json
          python -m json.tool evidence/platform-verification.json >/dev/null
      - name: Run query-plan benchmark
        run: db-bench benchmark --iterations 2 --output evidence/query-plans.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-engineering-evidence
          path: evidence/*.json
      - name: Build and verify wheel outside source tree
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/dist
          python -m venv /tmp/wheelcheck
          cd /tmp
          /tmp/wheelcheck/bin/pip install /tmp/dist/*.whl
          /tmp/wheelcheck/bin/python -c "from dbbench.migrations import discover_migrations; assert len(discover_migrations()) == 3"
      - run: docker compose config --quiet
