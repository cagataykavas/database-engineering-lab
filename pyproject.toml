[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-engineering-lab"
version = "1.0.0"
description = "PostgreSQL migrations, transactional ledger, durable jobs and plan regression toolkit"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
db-bench = "dbbench.cli:main"

[tool.setuptools]
packages = ["dbbench", "dbbench.sql"]

[tool.setuptools.package-data]
"dbbench.sql" = ["*.sql"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
